[tool.poetry]
name = "new_project"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = "^3.13.5"

[tool.poetry.group.lint.dependencies]
flake8 = "^6.1.0 "
black = "^23.12.1"
isort = "^6.1.0"
mypy = "^1.18.2  "

[tool.poetry.scripts]
lint = "scripts.lint_script:main"
fix = "scripts.fix_script:main"

[tool.black]
line-length = 119
exclude = '''
/(\.git|venv)/
'''

[tool.isort]
profile = "black"
line_length = 119
known_first_party = ["src"]

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"